name: CD

on:
    push:
        branches: 
            - main
jobs:
    cd:
        runs-on: ubuntu-latest

        steps: 
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 20
            - run: npm ci
            - run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes